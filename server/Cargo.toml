[package]
name = "shiye-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "拾页 / Shiye — 文档拍照转 Word 服务端"
license = "MIT OR Apache-2.0"

[lib]
name = "shiye_server"
path = "src/lib.rs"

[[bin]]
name = "shiye-server"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "fs", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "compression-gzip", "limit"] }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "macros",
    "migrate",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
toml = "0.8"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
] }
base64 = "0.22"
docx-rs = { version = "0.4", default-features = false, features = ["image"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
