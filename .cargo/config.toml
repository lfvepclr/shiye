# crates.io 镜像（全局 ~/.cargo/config.toml 里配的是已废弃的 git 索引，这里用 sparse 覆盖）
[source.crates-io]
replace-with = 'rsproxy-sparse'

[source.rsproxy-sparse]
registry = "sparse+https://rsproxy.cn/index/"

[net]
git-fetch-with-cli = true

# 静态 musl 交叉编译：rust-lld 链接 toolchain 自带的 musl CRT。
# 注意：仅当依赖树不含 C/asm（如 ring、libsqlite3-sys）时才够用；
# 含 C 依赖时需改用 `cargo zigbuild`，见 .agent/ 文档。
[target.x86_64-unknown-linux-musl]
linker = "rust-lld"

[target.aarch64-unknown-linux-musl]
linker = "rust-lld"
